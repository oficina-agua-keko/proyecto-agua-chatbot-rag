# docker-compose.aws.yml — Chatbot desplegado en una instancia EC2 de AWS.
#
#   docker compose -f docker-compose.aws.yml up -d --build
#   docker compose -f docker-compose.aws.yml run --rm api --ingesta     (cargar los embeddings)
#
# Solo el puerto 80 (página con el widget) queda expuesto; bff, api y PostgreSQL viven en la red
# interna. El registro (HU-38) usa Amazon DynamoDB real con el rol de la instancia, sin claves.
# Variables: archivo .env (ver .env.aws.example).

name: chatbot-aws

services:
  postgres-pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatbot_vectors}
      POSTGRES_USER: ${POSTGRES_USER:-chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en el .env}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      postgres-pgvector:
        condition: service_healthy
    environment:
      VECTOR_DB_URL: jdbc:postgresql://postgres-pgvector:5432/${POSTGRES_DB:-chatbot_vectors}
      POSTGRES_USER: ${POSTGRES_USER:-chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LLM_API_KEY: ${LLM_API_KEY:?Definir LLM_API_KEY en el .env}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com}
      LLM_MODEL: ${LLM_MODEL:-gpt-5-mini}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      # Vacío a propósito: DynamoDB de AWS con el rol de la instancia (no DynamoDB Local).
      DYNAMODB_ENDPOINT: ""
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-chatbot-interacciones}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    restart: unless-stopped

  bff:
    build: ./bff
    depends_on:
      - api
    environment:
      API_REST_URL: http://api:8081
      BFF_TIMEOUT_MS: 70000
    restart: unless-stopped

  web:
    build: ./widget
    depends_on:
      - bff
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgvector-data:
