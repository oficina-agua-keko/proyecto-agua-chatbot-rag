# Límite por persona (IP): 10 preguntas por minuto, con ráfaga de 5. Protege el saldo de OpenAI
# si alguien intenta enviar preguntas sin parar desde internet.
limit_req_zone $binary_remote_addr zone=chat:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri /index.html;
    }

    # El widget llama a /api/chat; nginx lo entrega al BFF, que valida y llama al ApiRest.
    location = /api/chat {
        limit_req zone=chat burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://bff:3000/api/v1/chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }
}
